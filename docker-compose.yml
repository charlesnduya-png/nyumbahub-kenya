services:
  db:
    image: postgres:16-alpine
    container_name: nyumbahub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nyumbahub
      POSTGRES_PASSWORD: nyumbahub
      POSTGRES_DB: nyumbahub
    ports:
      - "5432:5432"
    volumes:
      - nyumbahub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nyumbahub -d nyumbahub"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nyumbahub-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://nyumbahub:nyumbahub@db:5432/nyumbahub?schema=public
      AUTH_SECRET: docker-dev-secret-change-me
      AUTH_TRUST_HOST: "true"
      AUTH_URL: http://localhost:3000
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_NAME: NyumbaHub Kenya
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "run", "start:railway"]

volumes:
  nyumbahub_pgdata:
